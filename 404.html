<!DOCTYPE html>
<html lang="en">

  <link rel="icon" href="/odil-dev/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: 'Inter Tight';
      src: url('/odil-dev/assets/fonts/inter-tight-latin.woff2') format('woff2');
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Instrument Serif';
      src: url('/odil-dev/assets/fonts/instrument-serif-italic.woff2') format('woff2');
      font-weight: 400;

    }
    :root {
      --paper: #f2efe7;
      --ink: #141310;
      --muted: #6c675d;
      --accent: #b23a15;
      --line: rgba(20, 19, 16, 0.14);
      --sans: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;

      --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121110;
        --ink: #f3f0e8;
        --muted: #9b958a;
        --accent: #ff8a63;
        --line: rgba(242, 239, 231, 0.13);
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: -0.012em;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
    .wrap {
      display: flex;
      flex-direction: column;
      width: min(100% - 2 * clamp(20px, 4vw, 52px), 1280px);
      min-height: 100svh;
      margin-inline: auto;
      padding: 28px 0 32px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.04em;
    }
    .dot { color: var(--accent); }
    .body { margin-block: auto; padding: 12vh 0; max-width: 900px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--accent); }
    h1 {
      margin: clamp(22px, 4vh, 36px) 0 0;
      font-size: clamp(2.6rem, 7.2vw, 6rem);
      font-weight: 500;
      line-height: 0.96;
      letter-spacing: -0.055em;
    }
    h1 em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.02em; }
    .lead {
      max-width: 44ch;
      margin: 24px 0 0;
      font-size: 15px;
      line-height: 1.65;
      color: var(--muted);
    }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-top: 34px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border-radius: 100px;
      background: var(--ink);
      color: var(--paper);
      font-size: 13.5px;
      font-weight: 500;
      transition: background 0.35s ease;
    }
    .btn:hover { background: var(--accent); }
    .mail {
      padding-bottom: 2px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
      transition: border-color 0.35s ease;
    }
    .mail:hover { border-color: var(--accent); }
    .foot {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px 24px;
      margin: 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/odil-dev/">
      <span class="mark" aria-hidden="true">ON</span>
      <span>Odilbek<span class="dot">.</span></span>
    </a>

    <div class="body">
      <p class="eyebrow">404 / Page not found</p>
      <h1>This page <em>doesn't exist</em>.</h1>
      <p class="lead">The link may be broken, or the page has moved. Let's get you back to the work.</p>
      <div class="actions">
        <a class="btn" href="/odil-dev/">Back to the portfolio <span aria-hidden="true">↗</span></a>
        <a class="mail" href="mailto:normurodovodilbek3110@gmail.com">normurodovodilbek3110@gmail.com</a>
      </div>
    </div>

    <p class="foot">
      <span>Qarshi, Uzbekistan</span>
      <span><span id="clock">--:--</span> UZT · Portfolio / 2026</span>
    </p>
  </main>

  <script>
    (function () {
      var clock = document.getElementById('clock');
      if (!clock) return;
      var format = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Tashkent', hour: '2-digit', minute: '2-digit', hour12: false
      });
      function tick() { clock.textContent = format.format(new Date()); }
      tick();
      window.setInterval(tick, 30000);
    })();
  </script>
</body>
</html>
